<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout-container">
        <div class="card">
            <h1>Calcolatore BMI</h1>

            <!-- Form con invio a se stesso (POST) -->
            <form method="POST" action="bmi.php">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Il tuo nome">
                </div>

                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" step="0.1" min="1" required placeholder="es. 70">
                </div>

                <div class="form-group">
                    <label for="altezza">Altezza (cm)</label>
                    <input type="number" id="altezza" name="altezza" step="1" min="1" required placeholder="es. 175">
                </div>

                <button type="submit">Calcola</button>
            </form>
        </div>
    </div>
</body>
</html>
