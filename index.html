<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1 class="card-title">Calcolatore BMI</h1>

            <form id="bmiForm" novalidate>
                <!-- Campo Nome -->
                <div class="form-group">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" id="nome" class="form-input" placeholder="Es. Mario Rossi" required>
                </div>

                <!-- Campo Peso -->
                <div class="form-group">
                    <label class="form-label" for="peso">Peso (kg)</label>
                    <input type="number" id="peso" class="form-input" placeholder="Es. 70" step="0.1" min="1" required>
                </div>

                <!-- Campo Altezza -->
                <div class="form-group">
                    <label class="form-label" for="altezza">Altezza (cm)</label>
                    <input type="number" id="altezza" class="form-input" placeholder="Es. 175" step="1" min="1"
                        required>
                </div>

                <!-- Botone Invia -->
                <button type="submit" class="btn-submit">Calcola BMI</button>
            </form>

            <!-- Messaggio di errore inline per validazione -->
            <div id="errorMessage" class="error-message">
                Inserisci valori validi per tutti i campi.
            </div>

            <!-- Area di Visualizzazione Risultato -->
            <div id="resultBox" class="result-box">
                <p id="resultUser" class="result-user"></p>
                <div id="resultScore" class="result-score">0.0</div>
                <div id="resultBadge" class="result-badge">Categoria</div>
            </div>
        </div>
    </div>
</body>

</html>
